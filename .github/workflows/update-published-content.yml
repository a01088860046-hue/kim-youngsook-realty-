name: Update published content

on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: published-content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Fetch published Naver blog posts
        run: node scripts/fetch-blog-posts.mjs

      - name: Commit refreshed content
        shell: bash
        run: |
          if git diff --quiet -- content/blog-posts.json; then
            echo "No published content changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog-posts.json
          git commit -m "Update published blog content"
          git pull --rebase origin main
          git push
